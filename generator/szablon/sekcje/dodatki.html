<!-- ============ DODATKI: staly przycisk i staly spis (pokazuje je dopiero sekcje.js, bez JS ich nie ma) oraz okno podgladu zdjec ============ -->
<a class="dok" href="{{CTA_URL}}" data-anim="dok">{{CTA_ETYKIETA}}</a>
<div class="spis-staly" data-anim="spis-staly">
 <button type="button" class="spis-pigulka" aria-expanded="false" aria-controls="spis-lista"><span class="spis-pigulka-nr" data-spis-nr>01</span><span class="spis-pigulka-tyt" data-spis-tyt>{{PIERWSZY}}</span><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg><span class="wizualnie-ukryte">: spis treści</span></button>
 <nav class="spis-lista" id="spis-lista" aria-label="Spis treści (skróty)" hidden>
{{SKROTY}}
 </nav>
</div>
<dialog class="lb" data-lb-okno data-lenis-prevent aria-label="Powiększone zdjęcie">
 <button type="button" class="lb-zamknij" data-lb-zamknij>Zamknij</button>
 <figure class="lb-fig"><figcaption class="lb-podpis" data-lb-podpis></figcaption></figure>
 <button type="button" class="lb-nav lb-wstecz" data-lb-wstecz aria-label="Poprzednie zdjęcie"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
 <button type="button" class="lb-nav lb-dalej" data-lb-dalej aria-label="Następne zdjęcie"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</dialog>
